<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Registration Form</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="container">

        <section class="registration-card">

            <h1>IT Seminar Registration</h1>

            <p class="subtitle">
                Student Registration Form
            </p>

            <form id="registrationForm" novalidate>

                <!-- Full Name -->
                <div class="form-group">
                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        aria-describedby="fullNameError"
                        aria-invalid="false"
                        required
                    >

                    <p id="fullNameError" class="error"></p>
                </div>

                <!-- Student Number -->
                <div class="form-group">
                    <label for="studentNumber">Student Number</label>

                    <input
                        type="text"
                        id="studentNumber"
                        name="studentNumber"
                        placeholder="24-1234-123"
                        aria-describedby="studentNumberError"
                        aria-invalid="false"
                        required
                    >

                    <p id="studentNumberError" class="error"></p>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        aria-describedby="emailError"
                        aria-invalid="false"
                        required
                    >

                    <p id="emailError" class="error"></p>
                </div>

                <!-- Mobile Number -->
                <div class="form-group">
                    <label for="mobileNumber">Mobile Number</label>

                    <input
                        type="tel"
                        id="mobileNumber"
                        name="mobileNumber"
                        placeholder="09171234567"
                        aria-describedby="mobileNumberError"
                        aria-invalid="false"
                        required
                    >

                    <p id="mobileNumberError" class="error"></p>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        aria-describedby="passwordError passwordFeedback"
                        aria-invalid="false"
                        required
                    >

                    <p id="passwordFeedback" class="feedback"></p>
                    <p id="passwordError" class="error"></p>
                </div>

                <!-- Confirm Password -->
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        aria-describedby="confirmPasswordError"
                        aria-invalid="false"
                        required
                    >

                    <p id="confirmPasswordError" class="error"></p>
                </div>

                <!-- Course -->
                <div class="form-group">
                    <label for="course">Course</label>

                    <select
                        id="course"
                        name="course"
                        aria-describedby="courseError"
                        aria-invalid="false"
                        required
                    >
                        <option value="">Select your course</option>
                        <option value="BSIT">BSIT</option>
                        <option value="BSCS">BSCS</option>
                    </select>

                    <p id="courseError" class="error"></p>
                </div>

                <!-- Terms -->
                <div class="terms-group">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        aria-describedby="termsError"
                        aria-invalid="false"
                        required
                    >

                    <label for="terms">
                        I agree to the terms and conditions.
                    </label>

                </div>

                <p id="termsError" class="error"></p>

                <!-- Buttons -->
                <div class="button-group">

                    <button
                        type="submit"
                        id="registerBtn"
                    >
                        Register
                    </button>

                    <button
                        type="reset"
                        id="resetBtn"
                    >
                        Reset
                    </button>

                </div>

            </form>

            <!-- Success Message -->
            <div
                id="successMessage"
                class="success-message"
                hidden
            ></div>

            <!-- Registration Summary -->
            <section
                id="registrationSummary"
                class="summary"
                hidden
            >

                <h2>Registration Summary</h2>

                <p>
                    <strong>Full Name:</strong>
                    <span id="summaryName"></span>
                </p>

                <p>
                    <strong>Student Number:</strong>
                    <span id="summaryStudentNumber"></span>
                </p>

                <p>
                    <strong>Email:</strong>
                    <span id="summaryEmail"></span>
                </p>

                <p>
                    <strong>Mobile Number:</strong>
                    <span id="summaryMobileNumber"></span>
                </p>

                <p>
                    <strong>Course:</strong>
                    <span id="summaryCourse"></span>
                </p>

            </section>

        </section>

    </main>

    <script src="js/app.js"></script>

</body>
</html>
